<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <!-- Background gradient - dark with subtle gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080808" />
      <stop offset="100%" stop-color="#111111" />
    </linearGradient>
    
    <!-- Grid patterns -->
    <pattern id="gridPattern" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#82DCD2" stroke-width="0.5" stroke-opacity="0.15"/>
    </pattern>
    
    <!-- Glow filters -->
    <filter id="tealGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feFlood flood-color="#82DCD2" flood-opacity="0.7" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="softGlow"/>
      <feComposite in="SourceGraphic" in2="softGlow" operator="over"/>
    </filter>
    
    <filter id="purpleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feFlood flood-color="#9D4EDD" flood-opacity="0.7" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="softGlow"/>
      <feComposite in="SourceGraphic" in2="softGlow" operator="over"/>
    </filter>
    
    <filter id="orangeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feFlood flood-color="#FF9E00" flood-opacity="0.7" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="softGlow"/>
      <feComposite in="SourceGraphic" in2="softGlow" operator="over"/>
    </filter>
  </defs>
  
  <!-- Main background -->
  <rect width="1200" height="600" fill="url(#bgGradient)" />
  
  <!-- Subtle grid overlay -->
  <rect width="1200" height="600" fill="url(#gridPattern)" />
  
  <!-- Nodes with different colors -->
  <circle cx="200" cy="150" r="4" fill="#82DCD2" filter="url(#tealGlow)" />
  <circle cx="450" cy="280" r="3" fill="#9D4EDD" filter="url(#purpleGlow)" />
  <circle cx="300" cy="420" r="4" fill="#FF9E00" filter="url(#orangeGlow)" />
  <circle cx="600" cy="200" r="3" fill="#82DCD2" filter="url(#tealGlow)" />
  <circle cx="800" cy="350" r="4" fill="#9D4EDD" filter="url(#purpleGlow)" />
  <circle cx="950" cy="170" r="3" fill="#FF9E00" filter="url(#orangeGlow)" />
  <circle cx="700" cy="480" r="4" fill="#82DCD2" filter="url(#tealGlow)" />
  <circle cx="550" cy="500" r="3" fill="#9D4EDD" filter="url(#purpleGlow)" />
  <circle cx="400" cy="100" r="4" fill="#FF9E00" filter="url(#orangeGlow)" />
  <circle cx="900" cy="480" r="3" fill="#82DCD2" filter="url(#tealGlow)" />
  
  <!-- Connection lines with gradient effects -->
  <path d="M 200,150 L 400,100 L 600,200 L 800,350 L 900,480" 
        stroke="url(#tealOrangeGradient)" stroke-width="1.5" stroke-opacity="0.4" fill="none">
    <animate attributeName="stroke-opacity" values="0.2;0.5;0.2" dur="8s" repeatCount="indefinite" />
  </path>
  
  <path d="M 400,100 L 450,280 L 300,420 L 550,500 L 700,480" 
        stroke="#9D4EDD" stroke-width="1.5" stroke-opacity="0.3" fill="none">
    <animate attributeName="stroke-opacity" values="0.2;0.4;0.2" dur="10s" repeatCount="indefinite" />
  </path>
  
  <path d="M 600,200 L 950,170" 
        stroke="#FF9E00" stroke-width="1.5" stroke-opacity="0.3" fill="none">
    <animate attributeName="stroke-opacity" values="0.2;0.5;0.2" dur="7s" repeatCount="indefinite" />
  </path>
  
  <path d="M 800,350 L 700,480 L 900,480" 
        stroke="#82DCD2" stroke-width="1.5" stroke-opacity="0.3" fill="none">
    <animate attributeName="stroke-opacity" values="0.2;0.4;0.2" dur="9s" repeatCount="indefinite" />
  </path>
  
  <!-- Modern UI Element 1 -->
  <g transform="translate(825, 300)">
    <rect x="0" y="0" width="250" height="50" rx="3" fill="#0F0F0F" stroke="#82DCD2" stroke-width="1" stroke-opacity="0.4" />
    <line x1="10" y1="15" x2="70" y2="15" stroke="#82DCD2" stroke-width="2" stroke-opacity="0.7" />
    <line x1="85" y1="15" x2="125" y2="15" stroke="#9D4EDD" stroke-width="2" stroke-opacity="0.7" />
    <line x1="140" y1="15" x2="190" y2="15" stroke="#FF9E00" stroke-width="2" stroke-opacity="0.7" />
    <line x1="10" y1="35" x2="50" y2="35" stroke="#82DCD2" stroke-width="2" stroke-opacity="0.5" />
    <line x1="65" y1="35" x2="130" y2="35" stroke="#9D4EDD" stroke-width="2" stroke-opacity="0.5" />
    <circle cx="230" cy="15" r="8" stroke="#FF9E00" stroke-width="1" fill="none" />
    <path d="M 225,20 L 215,30" stroke="#FF9E00" stroke-width="1" stroke-opacity="0.7" fill="none" />
  </g>
  
  <!-- Horizontal traces with different colors -->
  <line x1="0" y1="120" x2="1200" y2="120" stroke="#9D4EDD" stroke-width="1" stroke-opacity="0.15" />
  <line x1="0" y1="240" x2="1200" y2="240" stroke="#82DCD2" stroke-width="1" stroke-opacity="0.15" />
  <line x1="0" y1="360" x2="1200" y2="360" stroke="#FF9E00" stroke-width="1" stroke-opacity="0.15" />
  <line x1="0" y1="480" x2="1200" y2="480" stroke="#9D4EDD" stroke-width="1" stroke-opacity="0.15" />
  
  <!-- Vertical traces with different colors -->
  <line x1="300" y1="0" x2="300" y2="600" stroke="#FF9E00" stroke-width="1" stroke-opacity="0.15" />
  <line x1="600" y1="0" x2="600" y2="600" stroke="#82DCD2" stroke-width="1" stroke-opacity="0.15" />
  <line x1="900" y1="0" x2="900" y2="600" stroke="#9D4EDD" stroke-width="1" stroke-opacity="0.15" />
  
  <!-- Animated scanning lines -->
  <line x1="0" y1="300" x2="1200" y2="300" stroke="#82DCD2" stroke-width="1" stroke-opacity="0.5">
    <animate attributeName="y1" values="0;600;0" dur="15s" repeatCount="indefinite" />
    <animate attributeName="y2" values="0;600;0" dur="15s" repeatCount="indefinite" />
    <animate attributeName="stroke-opacity" values="0.1;0.4;0.1" dur="15s" repeatCount="indefinite" />
  </line>
  
  <line x1="600" y1="0" x2="600" y2="600" stroke="#FF9E00" stroke-width="1" stroke-opacity="0.3">
    <animate attributeName="x1" values="0;1200;0" dur="20s" repeatCount="indefinite" />
    <animate attributeName="x2" values="0;1200;0" dur="20s" repeatCount="indefinite" />
    <animate attributeName="stroke-opacity" values="0.1;0.3;0.1" dur="20s" repeatCount="indefinite" />
  </line>
  
  <!-- Abstract tech shapes -->
  <path d="M 100,500 L 150,550 L 80,580 Z" fill="#9D4EDD" fill-opacity="0.2" stroke="#9D4EDD" stroke-width="1" stroke-opacity="0.5" />
  <path d="M 1050,100 L 1100,150 L 1030,180 Z" fill="#FF9E00" fill-opacity="0.2" stroke="#FF9E00" stroke-width="1" stroke-opacity="0.5" />
  
  <!-- Subtle pulse overlay -->
  <rect width="1200" height="600" fill="url(#bgGradient)" opacity="0.05">
    <animate attributeName="opacity" values="0.03;0.07;0.03" dur="10s" repeatCount="indefinite" />
  </rect>
</svg>